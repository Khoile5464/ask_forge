services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: askforge-backend
    ports:
      - "8000:8000"
    environment:
      # App settings
      - DEBUG=False
      - APP_PREFIX=/api

      # Chunking settings
      - CHUNK_SIZE=1024
      - CHUNK_OVERLAP=300
      - MIN_CHARS=300

      # Storage
      - PAGES_JSON_DIR=data/user_db

      # Chroma
      - CHROMA_PERSIST_DIR=.chroma
      - ANONYMIZED_TELEMETRY=False

      # Gemini API (REQUIRED - thay bằng API key của bạn)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-your-gemini-api-key-here}
      - GEMINI_MODEL_NAME=gemini-2.5-flash

      # Ollama chạy trên máy host (ngoài Docker) - cần `ollama pull` các model này trước
      # Linux: Ollama phải lắng nghe 0.0.0.0 (OLLAMA_HOST=0.0.0.0), vì mặc định chỉ nghe 127.0.0.1
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_EMBED_MODEL=bge-m3
      - OLLAMA_QG_MODEL=qwen2.5:3b
      - OLLAMA_CHAT_MODEL=qwen2.5:7b

      # Redis (nếu sử dụng Redis queue)
      - REDIS_URL=redis://redis:6379

      # CORS
      # List field: pydantic-settings expects JSON, not comma-separated
      - 'CORS_ORIGINS=["http://localhost:3000","http://localhost:3001"]'

    extra_hosts:
      # Docker Desktop tự có host.docker.internal; dòng này để chạy được cả trên Linux
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/data
      - ./backend/.chroma:/app/.chroma
    networks:
      - askforge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=http://localhost:8000
    container_name: askforge-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
    networks:
      - askforge-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis (optional - uncomment nếu muốn sử dụng Redis queue)
  # redis:
  #   image: redis:7-alpine
  #   container_name: askforge-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - askforge-network
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

networks:
  askforge-network:
    driver: bridge

volumes:
  redis-data: